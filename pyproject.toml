[project]
name = "spelling-bee-solver"
version = "0.1.0"
description = "Your application description"
requires-python = ">=3.14"
dependencies = [
    "Flask",
    "Werkzeug",
    "numpy",
    "apscheduler",
    "playwright==1.63.0",
    "urllib3>=2.8.0",
]

[build-system]
requires = ["hatchling>=1.27.0", "setuptools>=78.1.1"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]